<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcas - Nexura</title>
    <link rel="stylesheet" href="marcas.css">
    <link rel="stylesheet" href="menu.css">
</head>
<body>
<button class="menu-btn" onclick="abrirMenu()">☰</button>
    
<div class="sidebar" id="sidebar">

        <div class="logo-panel">
            <img src="img/logo.png" alt="Logo Nexura">
            <h2>Nexura</h2>
        </div>

        <ul class="menu">
            <a href="panel.html"><li>🏠 Panel general</li></a>
            <a href="inventario.html"><li>📦 Inventario</li></a>
            <a href="marcas.html"><li class="activo">🏷️ Marcas</li></a>
            <a href="productos.html"><li>🧪 Productos</li></a>
            <a href="movimientos.html"><li>📊 Reporte de movimientos</li></a>
        </ul>

    </div>

    <div class="contenido">

        <div class="encabezado">
            <h1>Marcas / Proveedores</h1>
            <div class="usuario">👤 Administrador</div>
        </div>

        <div class="barra-acciones">
            <input type="text" id="inputBusqueda" placeholder="Buscar por nombre o ID">
            <button class="btn-filtrar">Filtrar</button>
            <button class="btn-agregar" onclick="abrirModal()">Agregar</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Marca</th>
                    <th>Descripción</th>
                    <th>Consultar productos</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaMarcas">
            </tbody>
        </table>

        <div class="modal" id="modalMarca">

            <div class="modal-contenido">

                <h2>Agregar marca</h2>

                <form id="formMarca">

                    <label>Nombre de la marca:</label>
                    <input type="text" id="inputNombre" required>

                    <label>Descripción:</label>
                    <input type="text" id="inputDescripcion" required>

                    <div class="botones-modal">
                        <button type="submit" class="btn-agregar">Guardar</button>
                        <button type="button" class="btn-eliminar" onclick="cerrarModal()">Cancelar</button>
                    </div>

                </form>

            </div>

        </div>

    </div>

<script>
    function abrirModal(){
        document.getElementById("modalMarca").style.display = "flex";
    }

    function cerrarModal(){
        document.getElementById("modalMarca").style.display = "none";
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="menu.js"></script>
<script src="marcas.js"></script>

</body>
</html>
